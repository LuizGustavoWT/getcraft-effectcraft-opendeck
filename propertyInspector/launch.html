<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Open EffectCraft</title><link rel="stylesheet" href="run.css"></head><body><main><h1>Open EffectCraft</h1><p class="hint">Starts EffectCraft with the local bridge used by Live Control and Property Dial.</p><label>Desktop executable <span class="optional">optional</span><input id="executable" placeholder="effectcraft"></label><div class="grid"><label>Control host<input id="controlHost" value="127.0.0.1"></label><label>Control port<input id="controlPort" type="number" min="1" max="65535" value="9877"></label></div><p class="hint">EffectCraft accepts <code>--control PORT</code> and listens on this computer only.</p><label>Working directory <span class="optional">optional</span><input id="workingDirectory" placeholder="/home/me/Videos/project"></label><label>Key title<input id="title" value="Open EffectCraft"></label><div class="buttons"><button id="test" type="button">Open EffectCraft now</button></div><p id="status" role="status">Place this action on a key, then press it to open EffectCraft.</p></main><script>
let socket,context;const $=id=>document.getElementById(id),fields=["executable","controlHost","controlPort","workingDirectory","title"];function settings(){return{executable:$("executable").value.trim(),controlHost:$("controlHost").value.trim(),controlPort:Number($("controlPort").value)||9877,workingDirectory:$("workingDirectory").value.trim(),title:$("title").value.trim()||"Open EffectCraft"}}function persist(){if(socket&&context)socket.send(JSON.stringify({event:"setSettings",context,payload:settings()}))}function status(message,error=false){const e=$("status");e.textContent=message||"Ready.";e.className=error?"error":""}function receive(event){let m;try{m=JSON.parse(event.data)}catch(_){return}const p=m.payload||{};if(m.event==="sendToPropertyInspector"&&p.kind==="launch")status(p.message,!p.ok)}function connectElgatoStreamDeckSocket(port,propertyInspectorUUID,registerEvent,info,actionInfo){const a=JSON.parse(actionInfo),s=(a.payload&&a.payload.settings)||{};context=a.context;$("executable").value=s.executable||"";$("controlHost").value=s.controlHost||"127.0.0.1";$("controlPort").value=s.controlPort||9877;$("workingDirectory").value=s.workingDirectory||"";$("title").value=s.title||"Open EffectCraft";fields.forEach(id=>$(id).addEventListener("input",persist));socket=new WebSocket(`ws://localhost:${port}`);socket.onopen=()=>socket.send(JSON.stringify({event:registerEvent,uuid:propertyInspectorUUID}));socket.onmessage=receive;$("test").addEventListener("click",()=>{persist();status("Opening EffectCraft…");if(socket&&context)socket.send(JSON.stringify({event:"sendToPlugin",context,payload:{request:"launch",settings:settings()}}))})}
</script></body></html>
